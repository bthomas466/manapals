name: Migrate staging

# Applies migrations to the shared staging Supabase project for PRs labeled
# `db-change`. Previews all share staging, so schema PRs run one at a time.
on:
  pull_request:
    types: [labeled, synchronize]
    paths: [supabase/migrations/**]

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    if: contains(github.event.pull_request.labels.*.name, 'db-change')
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
      - run: supabase db push --include-all
