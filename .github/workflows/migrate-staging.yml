name: Migrate staging

# Applies migrations to the shared staging Supabase project for PRs labeled
# `db-change`. Previews all share staging, so schema PRs run one at a time.
on:
  pull_request:
    types: [labeled, synchronize]
    paths: [supabase/migrations/**]

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    if: contains(github.event.pull_request.labels.*.name, 'db-change')
    runs-on: ubuntu-latest
    environment: db-staging
    env:
      # Session-pooler connection string for this environment's project only
      # (IPv4, port 5432). Deliberately not an account-wide access token, so a
      # staging job can never reach prod.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
