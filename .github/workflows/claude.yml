name: Claude (@claude on PRs)

# Owner-only: `@claude <request>` in a PR comment or review asks Claude to
# change that PR's branch (fixes, tweaks, test updates). Ignored for anyone
# else, and on issues (issues go through the `factory` label instead).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  claude:
    if: >-
      github.event.sender.login == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
         contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
         contains(github.event.review.body, '@claude'))
      )
    # Job-level, so the skipped runs every other comment creates never
    # cancel or queue a real one. One Claude run at a time (factory and
    # @claude share the group): protects usage limits and staging users.
    concurrency:
      group: factory
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - name: Write staging .env.local
        run: |
          umask 077
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_STAGING_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          E2E_EMAIL=e2e@manapals.test
          E2E_PASSWORD=${{ secrets.E2E_PASSWORD }}
          EOF
          sed -i 's/^ *//' .env.local
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model sonnet
            --max-turns 120
            --allowedTools "Agent,Skill,Bash,Read,Write,Edit,Glob,Grep,TodoWrite"
          additional_permissions: |
            actions: read
