name: E2E

# Runs Playwright against each successful Vercel preview deployment.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment URL to test
        required: true
      update_snapshots:
        description: Regenerate all linux screenshot baselines (uploaded as an artifact)
        type: boolean
        default: false

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || inputs.base_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Previews run against staging; the auth setup signs in the seeded E2E
      # user there. Signed-in specs skip if E2E_PASSWORD isn't set.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_STAGING_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
      E2E_EMAIL: e2e@manapals.test
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npx playwright test ${{ inputs.update_snapshots && '--update-snapshots' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # New or regenerated baselines — download and commit to tests/e2e/__screenshots__/linux/.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshots
          if-no-files-found: ignore
          path: tests/e2e/__screenshots__/linux/
