name: Migrate production

# Applies migrations to the production Supabase project after merge to main.
# The `db-production` environment requires manual approval before this job runs.
on:
  push:
    branches: [main]
    paths: [supabase/migrations/**]
  workflow_dispatch:

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: db-production
    env:
      # Session-pooler connection string for this environment's project only
      # (IPv4, port 5432). Deliberately not an account-wide access token, so a
      # staging job can never reach prod.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dry run
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - run: supabase db push --db-url "$SUPABASE_DB_URL"
